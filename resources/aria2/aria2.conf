### Basic Options ###
# The directory to store the downloaded file.
dir=${HOME}/Downloads
# Downloads the URIs listed in FILE. 
# input-file=${HOME}/.aria2/aria2.session
# Save error/unfinished downloads to FILE on exit.
# save-session=${HOME}/.aria2/aria2.session
# Save error/unfinished downloads to a file specified by --save-session option every SEC seconds. If 0 is given, file will be saved only when aria2 exits. Default: 0
# save-session-interval=60
# The file name of the log file.
log=aria2.log
# Set the maximum number of parallel downloads for every queue item. See also the --split option. Default: 5
max-concurrent-downloads=5
# Check file integrity by validating piece hashes or a hash of entire file. 
check-integrity=true
# Continue downloading a partially downloaded file.
continue=true

### HTTP/FTP/SFTP Options ###
# Use a proxy server for all protocols. 
# all-proxy=[http://][USER:PASSWORD@]HOST[:PORT]
# Set password for --all-proxy option.
# all-proxy-passwd=
# Set user for --all-proxy option.
# all-proxy-user=
# Set checksum.
# checksum=<TYPE>=<DIGEST>
# Set the connect timeout in seconds to establish connection to HTTP/FTP/proxy server. 
connect-timeout=60
# If true is given, aria2 just checks whether the remote file is available and doesn't download data. 
dry-run=false
# Close connection if download speed is lower than or equal to this value(bytes per sec). 
lowest-speed-limit=0
# The maximum number of connections to one server for each download. 
max-connection-per-server=1
# If aria2 receives "file not found" status from the remote HTTP/FTP servers NUM times without getting a single byte, then force the download to fail. 
max-file-not-found=0
# Set number of tries. 
max-tries=5
# aria2 does not split less than 2*SIZE byte range. Possible Values: 1M -1024M. Default: 20M
min-split-size=20M
# Specify the path to the netrc file. 
# netrc-path=
# Disables netrc support. netrc support is enabled by default.
# no-netrc=
# Specify a comma separated list of host names, domains and network addresses with or without a subnet mask where no proxy should be used.
# no-proxy=<DOMAINS>
# The file name of the downloaded file.
# out=<FILE>
# Set the method to use in proxy request. 
# proxy-method=get
# Retrieve timestamp of the remote file from the remote HTTP/FTP server and if it is available, apply it to the local file.
remote-time=false
# Reuse already used URIs if no unused URIs are left. 
reuse-uri=true
# Set the seconds to wait between retries.
retry-wait=0
# Specify the file name to which performance profile of the servers is saved.
# server-stat-of=<FILE>
# Specify the file name to load performance profile of the servers. 
# server-stat-if=<FILE>
# Specifies timeout in seconds to invalidate performance profile of the servers since the last contact to them. 
server-stat-timeout=86400
# Download a file using N connections. The number of connections to the same host is restricted by the --max-connection-per-server option. Default: 5
split=5
# Specify piece selection algorithm used in HTTP/FTP download.
stream-piece-selector=default
# Set timeout in seconds. 
timeout=60
# Specify URI selection algorithm. 
uri-selector=feedback
# # Set user agent for HTTP(S) downloads. Default: aria2/$VERSION, $VERSION is replaced by package version.
# user-agent=Transmission/2.77

### HTTP Specific Options ###
# Use the certificate authorities in FILE to verify the peers. 
# ca-certificate=<FILE>
# Use the client certificate in FILE. 
# certificate=<FILE>
# Verify the peer using certificates specified in --ca-certificate option.
# check-certificate=true
# Send Accept-Encoding: deflate, gzip request header and inflate response if remote server responds with Content-Encoding: gzip or Content-Encoding: deflate.
http-accept-gzip=false
# Send HTTP authorization header only when it is requested by the server.
http-auth-challenge=false
# Send Cache-Control: no-cache and Pragma: no-cache header to avoid cached content.
http-no-cache=false
# Set HTTP user. This affects all URIs.
# http-user=<USER>
# Set HTTP password. This affects all URIs.
# http-passwd=<PASSWD>
# Use a proxy server for HTTP. 
# http-proxy=<PROXY>
# Set password for --http-proxy
# http-proxy-passwd=<PASSWD>
# Set user for --http-proxy.
# http-proxy-user=<USER>
# Use a proxy server for HTTPS. 
# https-proxy=<PROXY>
# Set password for --https-proxy.
# https-proxy-passwd=<PASSWD>
# Set user for --https-proxy.
# https-proxy-user=<USER>
# Use the private key in FILE. 
# private-key=<FILE>
# Set an http referrer (Referer). 
# referer=<REFERER>
# Enable HTTP/1.1 persistent connection. 
enable-http-keep-alive=true
# Enable HTTP/1.1 pipelining. 
enable-http-pipelining=false
# Append HEADER to HTTP request header.
# header=<HEADER>
# Load Cookies from FILE using the Firefox3 format (SQLite3), Chromium/Google Chrome (SQLite3) and the Mozilla/Firefox(1.x/2.x)/Netscape format.
# load-cookies=<FILE>
# Save Cookies to FILE in Mozilla/Firefox(1.x/2.x)/ Netscape format. 
# save-cookies=<FILE>
# Use HEAD method for the first request to the HTTP server.
use-head=false
# Whether to disable Want-Digest header when doing requests. 
no-want-digest-header=false
# Set user agent for HTTP(S) downloads.
user-agent=aria2/$VERSION

### FTP/SFTP Specific Options ###
# Set FTP user. This affects all URIs. 
ftp-user=anonymous
# Set FTP password. This affects all URIs. 
ftp-passwd=ARIA2USER@
# Use the passive mode in FTP. 
ftp-pasv=true
# Use a proxy server for FTP. 
# ftp-proxy=[http://][USER:PASSWORD@]HOST[:PORT]
# Set password for --ftp-proxy option.
# ftp-proxy-passwd=<PASSWD>
# Set user for --ftp-proxy option.
# ftp-proxy-user=<USER>
# Set FTP transfer type. TYPE is either binary or ascii.
# ftp-type=binary
# Reuse connection in FTP. 
ftp-reuse-connection=true
# Set checksum for SSH host public key. 
# ssh-host-key-md=<TYPE>=<DIGEST>


### BitTorrent/Metalink Options ###
# Set file to download by specifying its index. 
# select-file=<INDEX>
# Print file listing of ".torrent", ".meta4" and ".metalink" file and exit. 
# show-files=

### BitTorrent Specific Options ###
# Exclude seed only downloads when counting concurrent active downloads (See -j option).
bt-detach-seed-only=false
# Allow hook command invocation after hash check (see -V option) in BitTorrent download.
bt-enable-hook-after-hash-check=true
# Enable Local Peer Discovery. 
bt-enable-lpd=false
# Comma separated list of BitTorrent tracker's announce URI to remove.
# bt-exclude-tracker=<URI>
# Specify the external IP address to use in BitTorrent download and DHT. 
# bt-external-ip=<IPADDRESS>
# Requires BitTorrent message payload encryption with arc4. 
bt-force-encryption=false
# If true is given, after hash check using --check-integrity option and file is complete, continue to seed file. 
bt-hash-check-seed=true
# Before getting torrent metadata from DHT when downloading with magnet link, first try to read file saved by --bt-save-metadata option. 
bt-load-saved-metadata=false
# Use given interface for Local Peer Discovery. 
# bt-lpd-interface=
# Specify maximum number of files to open in multi-file BitTorrent/Metalink download globally.
bt-max-open-files=100
# Specify the maximum number of peers per torrent. 
bt-max-peers=55
# Download metadata only. 
bt-metadata-only=false
# Set minimum level of encryption method.
bt-min-crypto-level=plain
# Try to download first and last pieces of each file first. 
# bt-prioritize-piece=
# Removes the unselected files when download is completed in BitTorrent. 
bt-remove-unselected-file=false
# If true is given, aria2 doesn't accept and establish connection with legacy BitTorrent
bt-require-crypto=false
# If the whole download speed of every torrent is lower than SPEED, aria2 temporarily increases the number of peers to try for more download speed. 
bt-request-peer-speed-limit=50K
# Save metadata as ".torrent" file. 
bt-save-metadata=false
# Seed previously downloaded files without verifying piece hashes. 
bt-seed-unverified=false
# Stop BitTorrent download if download speed is 0 in consecutive SEC seconds. 
bt-stop-timeout=0
# Set the connect timeout in seconds to establish connection to tracker.
bt-tracker-connect-timeout=60
# Set the interval in seconds between tracker requests.
bt-tracker-interval=0
# Set timeout in seconds. 
bt-tracker-timeout=60
# Set host and port as an entry point to IPv4 DHT network.
# dht-entry-point=<HOST>:<PORT>
# Set host and port as an entry point to IPv6 DHT network.
# dht-entry-point6=<HOST>:<PORT>
# Change the IPv4 DHT routing table file to PATH. 
# dht-file-path=<PATH>
# Change the IPv6 DHT routing table file to PATH. 
# dht-file-path6=
# Specify address to bind socket for IPv6 DHT. 
# dht-listen-addr6=
# Set UDP listening port used by DHT(IPv4, IPv6) and UDP tracker. 
# dht-listen-port=
# Set timeout in seconds. 
# dht-message-timeout=10
# Enable IPv4 DHT functionality. 
enable-dht=true
# Enable IPv6 DHT functionality. 
# enable-dht6=true
# Enable Peer Exchange extension.
enable-peer-exchange=true
# If true or mem is specified, when a file whose suffix is .torrent or content type is application/x-bittorrent is downloaded, aria2 parses it as a torrent file and downloads files mentioned in it. 
follow-torrent=true
# Set file path for file with index=INDEX. 
# index-out=
# Set TCP port number for BitTorrent downloads.
# listen-port=
# Set max overall upload speed in bytes/sec. 
max-overall-upload-limit=0
# Specify the prefix of peer ID. 
# peer-id-prefix=
# Specify the string used during the bitorrent extended handshake for the peer's client version.
# peer-agent=<PEER_AGENT>
# Specify share ratio. 
seed-ratio=1.0
# Specify seeding time in (fractional) minutes.
# seed-time=0
# The path to the ".torrent" file.
# torrent-file=

### Metalink Specific Options ###
# If true or mem is specified, when a file whose suffix is .meta4 or .metalink or content type of application/metalink4+xml or application/metalink+xml is downloaded, aria2 parses it as a metalink file and downloads files mentioned in it. 
follow-metalink=true
# Specify base URI to resolve relative URI in metalink:url and metalink:metaurl element in a metalink file stored in local disk. 
# metalink-base-uri=<URI>
# # The file path to ".meta4" and ".metalink" file. 
# metalink-file=<METALINK_FILE>
# The language of the file to download.
# metalink-language=<LANGUAGE>
# The location of the preferred server. 
# metalink-location=jp,us
# The version of the file to download.
# metalink-version=
# Specify preferred protocol. 
metalink-preferred-protocol=none
# If true is given and several protocols are available for a mirror in a metalink file, aria2 uses one of them. 
# metalink-enable-unique-protocol=true

### RPC Options ###
# Enable JSON-RPC/XML-RPC server. 
enable-rpc=true
# Pause download after added. 
pause=false
# Pause downloads created as a result of metadata download. 
pause-metadata=false
# Add Access-Control-Allow-Origin header field with value * to the RPC response.
rpc-allow-origin-all=false
# Use the certificate in FILE for RPC server. 
# rpc-certificate=
# Listen incoming JSON-RPC/XML-RPC requests on all network interfaces. 
rpc-listen-all=true
# Specify a port number for JSON-RPC/XML-RPC server to listen to. 
rpc-listen-port=56800
# Set max size of JSON-RPC/XML-RPC request. 
# rpc-max-request-size=2M
# Use the private key in FILE for RPC server.
# rpc-private-key=<FILE>
# Save the uploaded torrent or metalink metadata in the directory specified by --dir option. 
rpc-save-upload-metadata=true
# Set RPC secret authorization token. 
# rpc-secret=<TOKEN>
# RPC transport will be encrypted by SSL/TLS. 
# rpc-secure


### Advanced Options ###
# Restart download from scratch if the corresponding control file doesn't exist. Default: false
allow-overwrite=true
# If false is given, aria2 aborts download when a piece length is different from one in a control file. If true is given, you can proceed but some download progress will be lost. Default: false
allow-piece-length-change=true
# Always resume download. If true is given, aria2 always tries to resume download and if resume is not possible, aborts download. If false is given, when all given URIs do not support resume or aria2 encounters N URIs which does not support resume, aria2 downloads file from scratch. Default: true
always-resume=true
# Enable asynchronous DNS. Default: true
async-dns=false
# Comma separated list of DNS server address used in asynchronous DNS resolver.
# async-dns-server=<IPADDRESS>[,...]
# Rename file name if the same file already exists. This option works only in HTTP(S)/FTP download. Default: true
auto-file-renaming=true
# Save a control file(*.aria2) every SEC seconds.
auto-save-interval=60
# Download file only when the local file is older than remote file. 
conditional-get=false
# Change the configuration file path to PATH. 
# conf-path=
# Set log level to output to console.
console-log-level=notice
# Handle quoted string in Content-Disposition header as UTF-8 instead of ISO-8859-1, for example, the filename parameter, but not the extended version filename*.
content-disposition-default-utf8=false
# Run as daemon. 
daemon=false
# If true is given, aria2 does not read all URIs and options from file specified by --input-file option at startup, but it reads one by one when it needs later. 
deferred-input=false
# Disable IPv6. 
disable-ipv6=false
# Enable disk cache. If SIZE is 0, the disk cache is disabled. This feature caches the downloaded data in memory, which grows to at most SIZE bytes. SIZE can include K or M. Default: 16M
disk-cache=64M
# This option changes the way Download Results is formatted. 
download-result=default
# Set DSCP value in outgoing IP packets of BitTorrent traffic for QoS.
# dscp=<DSCP>
# Set the soft limit of open file descriptors. 
# rlimit-nofile=<NUM>
# Enable color output for a terminal. 
enable-color=true
# Map files into memory. 
enable-mmap=false
# Specify the method for polling events. 
# event-poll=<POLL>
# Specify file allocation method. none doesn't pre-allocate file space. prealloc pre-allocates file space before download begins. This may take some time depending on the size of the file. If you are using newer file systems such as ext4 (with extents support), btrfs, xfs or NTFS(MinGW build only), falloc is your best choice. It allocates large(few GiB) files almost instantly. Don't use falloc with legacy file systems such as ext3 and FAT32 because it takes almost same time as prealloc and it blocks aria2 entirely until allocation finishes. falloc may not be available if your system doesn't have posix_fallocate(3) function. trunc uses ftruncate(2) system call or platform-specific counterpart to truncate a file to a specified length. Possible Values: none, prealloc, trunc, falloc. Default: prealloc
file-allocation=falloc
# Save download with --save-session option even if the download is completed or removed.
force-save=false
# Save download with --save-session option even if the file was not found on the server. 
save-not-found=true
# Set GID manually. 
# gid=<GID>
# If true is given, after hash check using --check-integrity option, abort download whether or not download is complete. 
hash-check-only=false
# Print sizes and speed in human readable format (e.g., 1.2Ki, 3.4Mi) in the console readout.
human-readable=true
# Bind sockets to given interface. You can specify interface name, IP address and host name.
# interface=<INTERFACE>
# Keep unfinished download results even if doing so exceeds --max-download-result.
keep-unfinished-download-result=true
# Set maximum number of download result kept in memory. 
max-download-result=1000
# Set the maximum file size to enable mmap (see --enable-mmap option). 
max-mmap-limit=9223372036854775807
# When used with --always-resume=false, aria2 downloads file from scratch when aria2 detects N number of URIs that does not support resume. 
# max-resume-failure-tries=
# Specify minimum SSL/TLS version to enable. 
min-tls-version=TLSv1.2
# Comma separated list of interfaces to bind sockets to. 
# multiple-interface=<INTERFACES>
# Set log level to output. LEVEL is either debug, info, notice, warn or error. 
# log-level=<LEVEL>
# For BitTorrent, a command specified in --on-download-complete is called after download completed and seeding is over. 
# on-bt-download-complete=<COMMAND>
# Set the command to be executed after download completed. 
# on-download-complete=<COMMAND>
# Set the command to be executed after download aborted due to error.
# on-download-error=<COMMAND>
# Set the command to be executed after download was paused. 
# on-download-pause=<COMMAND>
# Set the command to be executed after download got started. 
# on-download-start=<COMMAND>
# Set the command to be executed after download stopped.
# on-download-stop=<COMMAND>
# Optimizes the number of concurrent downloads according to the bandwidth available.
# optimize-concurrent-downloads=false
# Set a piece length for HTTP/FTP downloads.
# piece-length=1M
# Show console readout. 
# show-console-readout=true
# Redirect all console output that would be otherwise printed in stdout to stderr. 
# stderr=false
# Set interval in seconds to output download progress summary. 
# summary-interval=60
# Fetch URIs in the command-line sequentially and download each URI in a separate session, like the usual command-line download utilities.
# force-sequential=false
# Set max overall download speed in bytes/sec.
# max-overall-download-limit=0
# Set max download speed per each download in bytes/sec.
# max-download-limit=0
# Disable loading aria2.conf file.
# no-conf
# No file allocation is made for files whose size is smaller than SIZE. Default: 5M
no-file-allocation-limit=8M
# Enable parameterized URI support. 
# parameterized-uri=false
# Make aria2 quiet (no console output). 
# quiet=false
# Validate chunk of data by calculating checksum while downloading a file if chunk checksums are provided. 
# realtime-chunk-checksum=true
# Remove control file before download. 
# remove-control-file
# Save error/unfinished downloads to FILE on exit. 
# save-session=<FILE>
# Save error/unfinished downloads to a file specified by --save-session option every SEC seconds. 
# save-session-interval=0
# Set the maximum socket receive buffer in bytes. 
socket-recv-buffer-size=0
# Stop application after SEC seconds has passed.
# stop=0

### RPC ###
# Enable JSON-RPC/XML-RPC server. Default: false
enable-rpc=true
# Pause download after added. This option is effective only when --enable-rpc=true is given. Default: false
# pause=false
# Save the uploaded torrent or metalink meta data in the directory specified by --dir option. If false is given to this option, the downloads added will not be saved by --save-session option. Default: true
# rpc-save-upload-metadata=true
# Add Access-Control-Allow-Origin header field with value * to the RPC response. Default: false
rpc-allow-origin-all=true
# Listen incoming JSON-RPC/XML-RPC requests on all network interfaces. If false is given, listen only on local loopback interface. Default: false
rpc-listen-all=false
# Specify a port number for JSON-RPC/XML-RPC server to listen to. Possible Values: 1024 -65535 Default: 6800
# rpc-listen-port=50100
# Set RPC secret authorization token.
# rpc-secret=
# Use the certificate in FILE for RPC server. The certificate must be either in PKCS12 (.p12, .pfx) or in PEM format. When using PEM, you have to specify the private key via --rpc-private-key as well. Use --rpc-secure option to enable encryption.
# rpc-certificate=
# Use the private key in FILE for RPC server. The private key must be decrypted and in PEM format. Use --rpc-secure option to enable encryption.
# rpc-private-key=
# RPC transport will be encrypted by SSL/TLS. The RPC clients must use https scheme to access the server. For WebSocket client, use wss scheme. Use --rpc-certificate and --rpc-private-key options to specify the server certificate and private key.
# rpc-secure=false
# Stop application when process PID is not running. 
# stop-with-process=<PID>
# Truncate console readout to fit in a single line. 
# truncate-console-readout=true
# Print the version number, copyright and the configuration information and exit.
# version
