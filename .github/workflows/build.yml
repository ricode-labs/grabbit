name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x64
            os: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: latest
          cache: npm

      - name: Install Flatpak build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang dbus-x11 g++ elfutils flatpak flatpak-builder xvfb
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --version
          flatpak-builder --version
          clang++ --version

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build installer
        shell: bash
        env:
          DEBUG: "@malept/flatpak-bundler"
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm run package
          else
            npm run make
          fi

      - name: Build macOS pkg installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find out -type d -name 'Grabbit.app' -print -quit)
          test -n "$app"

          mkdir -p out/make/pkg
          version=$(node -p "require('./package.json').version")

          pkgbuild \
            --component "$app" \
            --install-location /Applications \
            --identifier io.github.ricodelabs.Grabbit \
            --version "$version" \
            out/make/pkg/Grabbit-macos-arm64.pkg

      - name: Install and run Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find out/make -type f -name '*.flatpak' -print -quit)
          test -n "$package"
          flatpak install --user --noninteractive "$package"

          dbus-run-session -- xvfb-run -a flatpak run io.github.ricodelabs.Grabbit >/tmp/grabbit.log 2>&1 &
          app_pid=$!
          found=0
          for _ in {1..20}; do
            if pgrep -f '[a]ria2c-linux-x86_64' >/dev/null; then
              found=1
              break
            fi
            sleep 1
          done

          kill "$app_pid" 2>/dev/null || true
          pkill -f '[a]ria2c-linux-x86_64' 2>/dev/null || true
          flatpak uninstall --user --noninteractive io.github.ricodelabs.Grabbit || true

          if [ "$found" -ne 1 ]; then
            cat /tmp/grabbit.log
            exit 1
          fi

      - name: Install and run macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg=$(find out/make -type f -name 'Grabbit-macos-arm64.pkg' -print -quit)
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /

          app_path="/Applications/Grabbit.app"
          "$app_path/Contents/MacOS/Grabbit" >/tmp/grabbit.log 2>&1 &
          app_pid=$!
          found=0
          for _ in {1..20}; do
            if pgrep -f '[a]ria2c-macos-arm64' >/dev/null; then
              found=1
              break
            fi
            sleep 1
          done

          kill "$app_pid" 2>/dev/null || true
          pkill -f '[a]ria2c-macos-arm64' 2>/dev/null || true

          if [ "$found" -ne 1 ]; then
            cat /tmp/grabbit.log
            exit 1
          fi

      - name: Install and run Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/make -Filter '*Setup.exe' -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru

          $app = $null
          for ($i = 0; $i -lt 30 -and -not $app; $i++) {
            $app = Get-ChildItem "$env:LOCALAPPDATA\grabbit" -Filter 'grabbit.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $app) { Start-Sleep -Seconds 1 }
          }
          if (-not $app) { throw 'Installed grabbit.exe not found' }

          $installerProcess.WaitForExit(60000)

          $appProcess = $null
          for ($i = 0; $i -lt 30 -and -not $appProcess; $i++) {
            try {
              $appProcess = Start-Process -FilePath $app.FullName -PassThru -ErrorAction Stop
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $appProcess) { throw "Installed grabbit.exe could not start: $($app.FullName)" }

          $found = $false
          for ($i = 0; $i -lt 20; $i++) {
            if (Get-Process -Name 'aria2c-windows-x86_64' -ErrorAction SilentlyContinue) {
              $found = $true
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue }
          cmd /c "taskkill /PID $($appProcess.Id) /T /F >NUL 2>NUL"
          $LASTEXITCODE = 0
          Get-Process -Name 'aria2c-windows-x86_64' -ErrorAction SilentlyContinue |
            Stop-Process -Force

          if (-not $found) { throw 'aria2c-windows-x86_64.exe did not start' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grabbit-${{ matrix.platform }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download installer artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: grabbit-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p prepared-release-assets

          flatpak=$(find release-assets -type f -name '*.flatpak' -print -quit)
          pkg=$(find release-assets -type f -name 'Grabbit-macos-arm64.pkg' -print -quit)
          setup=$(find release-assets -type f -name '*Setup.exe' -print -quit)

          test -n "$flatpak"
          test -n "$pkg"
          test -n "$setup"

          cp "$flatpak" "prepared-release-assets/Grabbit-linux-x64.flatpak"
          cp "$pkg" "prepared-release-assets/Grabbit-macos-arm64.pkg"
          cp "$setup" "prepared-release-assets/Grabbit-windows-x64-setup.exe"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find prepared-release-assets -type f -print0 |
            xargs -0 -r gh release upload "$GITHUB_REF_NAME"
