name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x64
            os: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: latest
          cache: npm

      - name: Install Flatpak build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes elfutils flatpak flatpak-builder xvfb
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build installer
        run: npm run make

      - name: Install and run Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=$(find out/make -type f -name '*.flatpak' -print -quit)
          test -n "$package"
          flatpak install --user --noninteractive "$package"

          xvfb-run -a flatpak run io.atom.electron.grabbit >/tmp/grabbit.log 2>&1 &
          app_pid=$!
          found=0
          for _ in {1..20}; do
            if pgrep -f '[a]ria2c-linux-x86_64' >/dev/null; then
              found=1
              break
            fi
            sleep 1
          done

          kill "$app_pid" 2>/dev/null || true
          pkill -f '[a]ria2c-linux-x86_64' 2>/dev/null || true
          flatpak uninstall --user --noninteractive io.atom.electron.grabbit || true

          if [ "$found" -ne 1 ]; then
            cat /tmp/grabbit.log
            exit 1
          fi

      - name: Install and run macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find out/make -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mountpoint=$(hdiutil attach "$dmg" -nobrowse -readonly | awk '/Apple_HFS|APFS/ {print $3; exit}')
          app_path="$RUNNER_TEMP/grabbit.app"
          ditto "$mountpoint/grabbit.app" "$app_path"
          hdiutil detach "$mountpoint"
          xattr -dr com.apple.quarantine "$app_path" || true

          "$app_path/Contents/MacOS/grabbit" >/tmp/grabbit.log 2>&1 &
          app_pid=$!
          found=0
          for _ in {1..20}; do
            if pgrep -f '[a]ria2c-macos-arm64' >/dev/null; then
              found=1
              break
            fi
            sleep 1
          done

          kill "$app_pid" 2>/dev/null || true
          pkill -f '[a]ria2c-macos-arm64' 2>/dev/null || true

          if [ "$found" -ne 1 ]; then
            cat /tmp/grabbit.log
            exit 1
          fi

      - name: Install and run Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem out/make -Filter '*Setup.exe' -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait

          $app = Get-ChildItem "$env:LOCALAPPDATA\grabbit" -Filter 'grabbit.exe' -Recurse |
            Select-Object -First 1
          if (-not $app) { throw 'Installed grabbit.exe not found' }

          $appProcess = Start-Process -FilePath $app.FullName -PassThru
          $found = $false
          for ($i = 0; $i -lt 20; $i++) {
            if (Get-Process -Name 'aria2c-windows-x86_64' -ErrorAction SilentlyContinue) {
              $found = $true
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
          Get-Process -Name 'aria2c-windows-x86_64' -ErrorAction SilentlyContinue |
            Stop-Process -Force

          if (-not $found) { throw 'aria2c-windows-x86_64.exe did not start' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: grabbit-${{ matrix.platform }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: grabbit-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find release-assets -type f -print0 |
            xargs -0 -r gh release upload "$GITHUB_REF_NAME"
